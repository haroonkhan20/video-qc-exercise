# Official temporalio/helm-charts chart 1.7.0; one replica per component.
fullnameOverride: temporal
server:
  replicaCount: 1
  image:
    repository: temporalio/server
    tag: "1.32.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  history:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
  additionalEnv:
    - name: GOMEMLIMIT
      value: 384MiB
    - name: GOMAXPROCS
      value: "2"
  config:
    logLevel: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      # Immutable once initialized. Four shards are enough for this laptop exercise.
      numHistoryShards: 4
      datastores:
        default:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: postgres.qc.svc.cluster.local:5432
            connectProtocol: tcp
            user: postgres
            existingSecret: postgres-secret
            secretKey: POSTGRES_PASSWORD
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
        visibility:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: postgres.qc.svc.cluster.local:5432
            connectProtocol: tcp
            user: postgres
            existingSecret: postgres-secret
            secretKey: POSTGRES_PASSWORD
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
    namespaces:
      create: true
      useHelmHooks: false
      namespace:
        - name: default
          retention: 1d
  dynamicConfig:
    matching.numTaskqueueReadPartitions:
      - value: 1
        constraints: {}
    matching.numTaskqueueWritePartitions:
      - value: 1
        constraints: {}
admintools:
  enabled: true
  image:
    repository: temporalio/admin-tools
    tag: "1.32.0"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
web:
  enabled: true
  replicaCount: 1
  image:
    repository: temporalio/ui
    tag: "2.54.1"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
# Retain bootstrap Jobs: no hook deletion or timed cleanup during make up.
schema:
  useHelmHooks: false
  ttlSecondsAfterFinished: null
  backoffLimit: 5
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
test:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
