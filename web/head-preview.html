<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Head movement — controlled test preview</title><link rel="stylesheet" href="/style.css"><script defer src="/head-motion.js"></script></head>
<body><main style="margin:0 auto;max-width:1000px;padding:30px"><h1>Head movement test preview</h1><p>Controlled synthetic examples. These are not findings from your real recordings, and they do not establish real-world classification accuracy.</p><label for="case">Choose an example</label> <select id="case"></select><div id="result" style="margin-top:20px"></div><p id="context" role="status"></p></main>
<script>window.addEventListener('DOMContentLoaded',async()=>{const container=document.getElementById('result');try{const response=await fetch('/api/head-examples');if(!response.ok)throw Error('Examples unavailable. Generate the controlled fixtures first.');const data=await response.json();const select=document.getElementById('case');for(const [index,item] of data.cases.entries()){const option=document.createElement('option');option.value=index;option.textContent=item.name;select.append(option);}function show(){container.innerHTML=HeadMotionUI.render(data.cases[select.value].result,false);const download=document.getElementById('headDownload');download.href=URL.createObjectURL(new Blob([JSON.stringify(data.cases[select.value],null,2)],{type:'application/json'}));download.download='controlled-head-example.json';}select.onchange=show;show();container.onclick=event=>{if(event.target.closest('[data-problem-start]'))document.getElementById('context').textContent='This is a synthetic head-only test. There are no camera images for it.';};}catch(error){container.textContent=error.message;}});</script></body></html>
