<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movement check examples</title><link rel="stylesheet" href="/style.css"><script defer src="/hand-motion.js"></script></head><body><main style="margin:0 auto;max-width:900px;padding:24px"><h1>Movement check examples</h1><p>Artificial test recordings, not findings from your real files.</p><label for="case">Choose an example</label> <select id="case"></select><div id="result"></div><p id="context" role="status"></p></main><script>
window.addEventListener('DOMContentLoaded',async()=>{const data=await (await fetch('/api/hand-examples')).json();const select=document.getElementById('case');data.cases.forEach((item,i)=>select.add(new Option(item.name,i)));function show(){document.getElementById('result').innerHTML=HandMotionUI.render(data.cases[select.value].result);const link=document.getElementById('handDownload');link.href=URL.createObjectURL(new Blob([JSON.stringify(data.cases[select.value],null,2)],{type:'application/json'}));link.download='controlled-movement-example.json';}select.onchange=show;show();document.getElementById('result').onclick=e=>{if(e.target.closest('[data-problem-start]'))document.getElementById('context').textContent='This artificial test has no camera images.';};});
</script></body></html>
